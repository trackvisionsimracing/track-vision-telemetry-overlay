<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Vision Overlay — Control Panel</title>
  <link rel="stylesheet" href="control.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="panel-header">
    <div id="panel-branding">
      <img id="panel-logo" src="../overlay/helmet.svg" alt="" />
      <h1>Track Vision Overlay</h1>
    </div>
    <span id="conn-badge">WAITING</span>
  </div>

  <!-- Overlay toggle -->
  <div id="overlay-power-section">
    <button id="btn-overlay-power">
      <span id="overlay-power-dot"></span>
      <span id="overlay-power-label">TOGGLE OVERLAY</span>
    </button>
  </div>

  <!-- Overlay settings -->
  <div class="section">
    <div class="section-title">Overlay</div>

    <div class="toggle-row">
      <span class="toggle-label">Lock position</span>
      <label class="toggle">
        <input type="checkbox" id="tog-locked" />
        <span class="toggle-track"></span>
      </label>
    </div>

    <div class="slider-row">
      <label for="sl-opacity">Opacity</label>
      <input type="range" id="sl-opacity" min="0" max="1" step="0.01" value="0.85" />
    </div>

    <button class="btn" id="btn-move-overlay">Move Overlay</button>
  </div>

  <!-- Channels -->
  <div class="section">
    <div class="section-title">Channels</div>
    <div class="checkbox-grid">
      <label class="checkbox-item"><input type="checkbox" id="ch-throttle" /> Throttle</label>
      <label class="checkbox-item"><input type="checkbox" id="ch-brake" />    Brake</label>
      <label class="checkbox-item"><input type="checkbox" id="ch-clutch" />   Clutch</label>
      <label class="checkbox-item"><input type="checkbox" id="ch-steering" /> Steering</label>
      <label class="checkbox-item"><input type="checkbox" id="ch-gear" />     Gear</label>
      <label class="checkbox-item"><input type="checkbox" id="ch-speed" />    Speed</label>
      <label class="checkbox-item"><input type="checkbox" id="ch-rpm" />      RPM</label>
    </div>
  </div>

  <!-- Ghost lines -->
  <div class="section">
    <div class="section-title">Ghost Lines</div>
    <div class="ghost-cols">
      <label class="checkbox-item"><input type="checkbox" id="gh-session" />  Session best</label>
      <label class="checkbox-item"><input type="checkbox" id="gh-throttle" /> Show throttle</label>
      <label class="checkbox-item"><input type="checkbox" id="gh-brake" />    Show brake</label>
    </div>
    <div class="btn-row">
      <button class="btn danger" id="btn-reset-cur">Reset current</button>
      <button class="btn danger" id="btn-reset-all">Reset all</button>
    </div>
  </div>

  <!-- Theme -->
  <div class="section">
    <div class="section-title">Theme</div>
    <div class="color-row">
      <label for="col-accent">Accent color</label>
      <input type="color" id="col-accent" value="#39FF14" />
    </div>
  </div>

  <!-- System -->
  <div class="section">
    <div class="section-title">System</div>
    <div class="toggle-row">
      <span class="toggle-label">Launch on startup</span>
      <label class="toggle">
        <input type="checkbox" id="tog-startup" />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="detected-wheel-row">
      <span class="toggle-label">Detected wheel</span>
      <span id="detected-wheel">—</span>
    </div>
    <div class="detected-wheel-row">
      <span class="toggle-label">Telemetry port</span>
      <span id="f1-port">—</span>
    </div>
    <div class="select-row">
      <label for="sel-wheel-img">Wheel image</label>
      <select id="sel-wheel-img">
        <option value="simagic-gt">Simagic GT</option>
        <option value="simagic-fx-pro">Simagic FX Pro</option>
        <option value="simagic-gts">Simagic GTS Leather</option>
        <option value="fanatec">Fanatec</option>
        <option value="simucube">Simucube</option>
        <option value="drawn">Drawn wheel</option>
      </select>
    </div>
    <button class="btn quit-btn" id="btn-quit">Close App</button>
  </div>

  <div id="panel-footer">
    <small>trackvisionsimracing.com</small>
    <small>© 2026</small>
  </div>

  <script src="control.js"></script>
</body>
</html>
